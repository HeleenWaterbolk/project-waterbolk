<!DOCTYPE html PUBLIC "-//W3C//DTD HTML 4.01 Transitional//EN">
<html>
<head>
    <meta http-equiv="content-type" content="text/html; charset=UTF-8">
    <meta charset="UTF-8">
    <title>horizontaal mythisch</title>
    <style>
        * {
            box-sizing: border-box;
        }

        body, html { 
            margin: 0; 
            padding: 0; 
            height: 100%;
            font-family: 'Helvetica', Arial, sans-serif;
            background: #fcfcfc; 
            overflow: hidden; /* Voorkomt alle scrollbars op de pagina zelf */
        }

        /* Container voor de hele pagina die de titel en de scroller netjes verdeelt */
        .page-container {
            display: flex;
            flex-direction: column;
            height: 100vh;
            padding: 20px 0;
        }
        
        /* ----- STYLING VOOR DE HOOFDTITEL (BLIJFT VAST BOVENAAN) ----- */
        .main-title {
            font-family: 'Times New Roman', 'Times', 'Times Roman', Georgia, serif; 
            font-style: italic; 
            font-size: 2.2rem; 
            font-weight: normal;
            color: #333;
            margin: 0 0 20px 0; 
            text-align: center;
            width: 100%;
            letter-spacing: 0.18em; 
            font-variant-ligatures: none; 
            flex-shrink: 0; /* Zorgt dat de titel niet inkrimpt */
        }

        /* De horizontale scroller, alleen voor de afbeeldingen */
        .gallery {
            display: flex;
            flex-direction: row;
            gap: 10px; /* Kleine afstand tussen de beelden */
            padding: 0 40px;
            overflow-x: auto; /* Alleen hier komt de horizontale scrollbalk */
            overflow-y: hidden;
            align-items: center;
            flex-grow: 1; /* Neemt de resterende hoogte in */
            scroll-behavior: smooth;
        }

        .artwork {
            flex-shrink: 0; /* Voorkomt dat afbeeldingen in elkaar gedrukt worden */
            margin: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }

        /* Alle afbeeldingen en video's zijn nu exact vierkant op basis van de schermhoogte */
        .artwork img, .artwork video {
            height: 60vh; /* Hoogte van het vierkant */
            width: 60vh;  /* Breedte is gelijk aan de hoogte voor een perfect vierkant */
            object-fit: cover; /* Snijdt de afbeelding netjes af zonder te vervormen */
            display: block;
            border: 1px solid #ddd;
            box-shadow: 0 4px 15px rgba(0,0,0,0.05);
            border-radius: 4px;
        }

        .artwork figcaption {
            margin-top: 10px;
            font-size: 1rem;
            color: #666;
            text-align: center;
            font-weight: 300;
        }

        /* Styling voor interactieve afbeeldingen */
        #afbeelding7, #afbeelding9 {
            cursor: pointer;
            transition: transform 0.2s ease;
        }

        #afbeelding7:hover, #afbeelding9:hover {
            transform: scale(1.03);
        }
    </style>
</head>
<body>

<div class="page-container">
    <h1 class="main-title">blank movie    cut 1</h1>

    <main class="gallery">
         <figure class="artwork">
            <img src="afbeelding1.1.jpg" alt="picture">
            <figcaption>1</figcaption>
        </figure>
          <figure class="artwork">
            <img src="afbeelding2.1.jpg" alt="picture">
            <figcaption>2</figcaption>
        </figure>

        <figure class="artwork">
            <img src="afbeelding3.1.jpg" alt="picture">
            <figcaption>3</figcaption>
        </figure>
        
        <figure class="artwork">
            <img src="afbeelding4.1.jpg" alt="figure">
            <figcaption>4</figcaption>
        </figure>
        
        <figure class="artwork">
            <img src="afbeelding5.1.jpg" alt="picture">
            <figcaption>5</figcaption>
        </figure>
          
        <figure class="artwork">
            <img src="afbeelding6.1.jpg" alt="picture">
            <figcaption>6</figcaption>
        </figure>

        <figure class="artwork">
            <img src="afbeelding7.1.jpg" alt="picture">
            <figcaption>7</figcaption>
        </figure>

        <figure class="artwork">
            <img src="afbeelding8.1.jpg" alt="picture">
            <figcaption>8</figcaption>
        </figure>

        <figure class="artwork">
            <img src="afbeelding9.1.jpg" alt="picture">
            <figcaption>9</figcaption>
        </figure>

        <figure class="artwork">
            <img src="afbeelding10.1.jpg" alt="picture">
            <figcaption>10</figcaption>
        </figure>
        
        <figure class="artwork">
            <img src="afbeelding11.1.jpg" alt="picture">
            <figcaption>11</figcaption>
        </figure>
        
        <figure class="artwork">
            <img src="afbeelding12.1.jpg" alt="picture">
            <figcaption>12</figcaption>
        </figure>
     
    </main>
</div>

<script>
document.addEventListener('DOMContentLoaded', () => {
    const movieTrigger = document.getElementById('afbeelding9');
    
    if(movieTrigger) {
        movieTrigger.addEventListener('click', function(e) {
            e.preventDefault();
            
            const video = document.createElement('video');
            video.src = 'animatiehaak.mp4';
            video.controls = true;
            video.autoplay = true;
            
            // De video krijgt exact dezelfde vierkante afmetingen als de afbeeldingen
            video.style.height = '60vh';
            video.style.width = '60vh';
            video.style.objectFit = 'cover';
            
            const parent = movieTrigger.parentNode;
            parent.replaceChild(video, movieTrigger);
        });
    }
});
</script>

</body>
</html>
